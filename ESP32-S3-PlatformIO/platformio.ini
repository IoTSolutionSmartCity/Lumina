[platformio]
default_envs = esp32s3_n16r8_test

[env:esp32s3_base]
; Official PlatformIO espressif32 still ships Arduino core 2.x.
; HomeSpan 2.1.8+ requires Arduino-ESP32 3.3.0+, so use the pioarduino fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ESP32S3-N16R8 commonly means 16 MB flash + 8 MB Octal PSRAM.
; If your exact module has no PSRAM or a different PSRAM type, update these three lines.
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

[env:esp32s3_n16r8]
extends = env:esp32s3_base
build_src_filter = +<*> -<PlatformIO_Blink_Test.cpp>
build_flags =
  ${env:esp32s3_base.build_flags}
  -DPWM_R_PIN=4
  -DPWM_G_PIN=5
  -DPWM_B_PIN=6
  -DSTATUS_LED_PIN=48
lib_deps =
  https://github.com/HomeSpan/HomeSpan.git
  adafruit/Adafruit NeoPixel@^1.12.3
lib_ldf_mode = deep

[env:esp32s3_n16r8_test]
extends = env:esp32s3_base
build_src_filter = +<PlatformIO_Blink_Test.cpp> -<Esp32S3_homekit.cpp>
lib_deps =
  https://github.com/HomeSpan/HomeSpan.git
lib_ldf_mode = deep
